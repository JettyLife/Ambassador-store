<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Jetty Ambassador Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}

/* Layout: sticky shop header + allowance strip, card grid of styles, slide-in cart drawer */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#122633; --muted:#5d6f7a; --line:#d9e2e6;
  --accent:#1f6f78; --accent-ink:#ffffff; --accent-soft:#e1efef; --tile:#e7edef;
  --warn:#b4521e; --warn-soft:#fbe9df; --ok:#2d7a4b;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1820; --surface:#14222c; --ink:#e6eef1; --muted:#93a6b0; --line:#253742;
  --accent:#5fb6bd; --accent-ink:#0b1a20; --accent-soft:#183339; --tile:#1b2c37;
  --warn:#f0925c; --warn-soft:#3a2216; --ok:#6cc690; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1820; --surface:#14222c; --ink:#e6eef1; --muted:#93a6b0; --line:#253742;
  --accent:#5fb6bd; --accent-ink:#0b1a20; --accent-soft:#183339; --tile:#1b2c37;
  --warn:#f0925c; --warn-soft:#3a2216; --ok:#6cc690; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
@media(max-width:520px){.wrap{padding-inline:16px}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:16px;padding-block:14px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
nav.dept{display:flex;gap:4px;margin-left:12px}
nav.dept button{border:0;background:none;padding:8px 14px;border-radius:var(--r);font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
nav.dept button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;max-width:240px}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);display:block;font-size:11px;line-height:1}
.cartbtn{position:relative;border:0;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:9px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.cartbtn .ct{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;padding:0 6px;font-size:12px;line-height:22px;text-align:center;font-variant-numeric:tabular-nums}

/* allowance strip */
.allow{border-top:1px solid var(--line);padding-block:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.allow .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.meter{flex:1;min-width:180px;height:10px;border-radius:999px;background:var(--tile);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:999px;transition:width .35s ease,background .2s}
.meter.over i{background:var(--warn)}
.nums{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.nums b{font-weight:600}
.nums .left{color:var(--muted);margin-left:6px}
.nums .left.over{color:var(--warn);font-weight:600}

@media(max-width:760px){
  .bar1{flex-wrap:wrap;gap:10px}
  nav.dept{order:5;margin-left:0;width:100%}
  .who{max-width:170px}
}

/* toolbar */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:22px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px;min-width:0}
.search input{border:0;background:none;padding:8px 2px;width:200px;max-width:50vw;outline:none}
.headline{display:flex;align-items:baseline;gap:12px;padding-block:10px 14px}
.headline h1{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.headline span{color:var(--muted);font-size:14px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-block:0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card.has{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ph{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--tile);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease}
.ph img.b{opacity:0}
.ph.two:hover img.b,.ph.two.flip img.b{opacity:1}
.ph.two:hover img.a,.ph.two.flip img.a{opacity:0}
.ph .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:16px}
.ph .none b{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);opacity:.55;line-height:1}
.ph .none small{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ph .tag{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);font-size:11px;padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.ph .dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ph .dots i{width:6px;height:6px;border-radius:50%;background:var(--surface);opacity:.7}
.cb{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.ttl{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ttl h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.price small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta .code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);opacity:.8}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:auto}
.sz{display:flex;flex-direction:column;align-items:center;gap:3px}
.sz label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.sz input{width:100%;text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield}
.sz input::-webkit-outer-spin-button,.sz input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sz input.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cf{font-size:12.5px;color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums}
.cf b{color:var(--accent)}
.empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,18,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:4px 8px}
.db{flex:1;overflow:auto;padding:8px 20px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.line .th{width:56px;aspect-ratio:4/5;background:var(--tile);border-radius:4px;overflow:hidden;position:relative}
.line .th img{width:100%;height:100%;object-fit:cover}
.line h4{margin:0;font-size:14px;font-weight:600}
.line .sub{font-size:12px;color:var(--muted)}
.line .qs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.line .qs span{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-variant-numeric:tabular-nums}
.line .rt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;margin-top:6px}
.df{border-top:1px solid var(--line);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot b{font-size:18px}
.note{border-radius:var(--r);padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:9px 10px;min-height:60px;resize:vertical}
.fl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.primary{display:block;text-align:center;text-decoration:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:13px 16px;font-weight:600;font-size:15px}
.primary[disabled]{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:none;border-radius:var(--r);padding:11px 16px;font-weight:500}
.dempty{padding:50px 10px;text-align:center;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.review dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.review dt{color:var(--muted)}
.review dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500}
pre.ordertext{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;max-height:240px;overflow:auto;margin:0;user-select:all}
.okbox{background:var(--accent-soft);border-radius:var(--r);padding:14px;font-size:14px}
.okbox b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:var(--accent);margin-bottom:4px}

/* name picker */
.modal{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8vh) 16px 40px}
.pick{width:min(460px,100%);display:flex;flex-direction:column;gap:16px}
.pick .brand b{font-size:40px}
.pick h2{margin:6px 0 0;font-family:var(--f-display);font-size:30px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.pick p{margin:0;color:var(--muted)}
.pick input{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;font-size:16px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:46vh;overflow:auto}
.plist button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;text-align:left}
.plist button:last-child{border-bottom:0}
.plist button:hover,.plist button:focus-visible{background:var(--accent-soft)}
.plist small{color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:70}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ph img.a{opacity:0}
.ph.hasA img.a{opacity:1}
.ph.two:hover img.a,.ph.two.flip img.a{opacity:0}
.banner{margin-top:18px;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.banner b{color:var(--accent)}
fieldset.ship{border:0;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
fieldset.ship legend{padding:0;margin-bottom:8px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 6;min-width:0}
.f span{font-size:12px;color:var(--muted)}
.f input{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:10px 11px;font-size:16px}
.f-city{grid-column:span 3}.f-state{grid-column:span 1}.f-zip{grid-column:span 2}
@media(max-width:420px){.f-city{grid-column:span 6}.f-state{grid-column:span 2}.f-zip{grid-column:span 4}}
.primary:disabled{opacity:.6;cursor:progress}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
@media(max-width:760px){
  .bar1 .cartbtn{order:2}
  nav.dept{order:5;width:auto;flex:1}
  .who{order:6;margin-left:auto}
  .search{flex:1 1 100%;margin-left:0}
  .search input{width:100%;max-width:none}
}
@media(max-width:480px){
  .grid{gap:10px}
  .cb{padding:10px 10px 12px}
  .ttl{flex-direction:column;gap:2px}
  .price{text-align:left}
  .price small{display:inline;margin-left:4px}
  .ttl h3{font-size:18px}
  .sizes{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
  nav.dept button{padding:6px 10px;font-size:17px}
}
</style></head><body>
<header class="top">
  <div class="wrap bar1">
    <div class="brand"><b>Jetty</b><span id="seasonLbl">Ambassador Store</span></div>
    <nav class="dept" id="dept">
      <button type="button" data-d="mens" aria-pressed="true">Mens</button>
      <button type="button" data-d="acc" aria-pressed="false">Accessories</button>
    </nav>
    <div class="spacer"></div>
    <div class="who" id="who">
      <span class="av" id="whoAv">·</span>
      <span class="nm"><small>Ordering as</small><span id="whoNm">Loading…</span></span>
    </div>
    <button type="button" class="cartbtn" id="cartBtn">Cart <span class="ct" id="cartCt">0</span></button>
  </div>
  <div class="wrap allow">
    <span class="lbl">Your allowance</span>
    <div class="meter" id="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Allowance used"><i id="meterFill"></i></div>
    <span class="nums" id="nums"></span>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="placedBanner" hidden></div>
  <div class="tools">
    <div class="chips" id="chips"></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search styles" aria-label="Search styles"></label>
  </div>
  <div class="headline"><h1 id="h1">Mens</h1><span id="countLbl"></span></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Cart">
  <div class="dh"><h2 id="dTitle">Your cart</h2><button type="button" class="x" id="closeCart" aria-label="Close cart">×</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>

<div class="modal" id="gate" hidden>
  <div class="pick">
    <div class="brand"><b>Jetty</b><span id="gateSeason">Ambassador Store</span></div>
    <h2 id="gateH">Use your personal link</h2>
    <p id="gateP">This store opens from the personal link in your invitation email. Open that email and tap the link to start your order.</p>
    <p class="hint" id="gateC"></p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

/* ===== State ===== */
const S = { dept:"mens", sub:"All", q:"", me:null, code:"", cart:{}, ship:{} };
const BY_UPC = {};
PRODUCTS.forEach(p => p.z.forEach(([size, upc]) => BY_UPC[upc] = { p, size }));
const $ = id => document.getElementById(id);
const money = n => "$" + (Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2});
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const K = s => "jas:" + CONFIG.season + ":" + (S.me ? S.me.id : "") + ":" + s;
const initials = n => n.replace(/[^\p{L}\s'-]/gu,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("") || "·";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== Personal link: #CODE unlocks a/<sha256>.json (AES-GCM, key from the code) ===== */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function fileIdFor(code){
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("jetty-amb:" + code));
  return [...new Uint8Array(h)].slice(0,10).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function unlock(code, blob){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.s), iterations:blob.k, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.i)}, key, b64(blob.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadMe(){
  let code = (location.hash || "").replace(/^#/, "").trim().toUpperCase();
  if (!code) code = store.get("jas:code") || "";
  if (!/^[A-Z0-9]{8,32}$/.test(code)) return null;
  try {
    const r = await fetch("a/" + await fileIdFor(code) + ".json", { cache: "no-store" });
    if (!r.ok) return null;
    const me = await unlock(code, await r.json());
    store.set("jas:code", code);
    if (location.hash.replace("#","").toUpperCase() !== code) history.replaceState(null, "", "#" + code);
    S.code = code;
    return me;
  } catch(e) { return null; }
}
function showGate(){
  $("gate").hidden = false;
  $("gateC").innerHTML = `Can't find it, or the link isn't working? Email <strong style="user-select:all">${esc(CONFIG.contact)}</strong> and we'll resend it.`;
}

/* ===== Totals / header ===== */
function totals(){
  let units=0, value=0;
  for (const [upc,q] of Object.entries(S.cart)) { const r=BY_UPC[upc]; if(!r||!q) continue; units+=q; value+=q*r.p.p; }
  return { units, value };
}
function meterHTML(t, a){
  const over = t.value > a, pct = a ? Math.min(100, t.value/a*100) : 0;
  return { over, pct };
}
function renderHeader(){
  const lbl = CONFIG.season + " Ambassador Store";
  $("seasonLbl").textContent = $("gateSeason").textContent = lbl;
  document.title = "Jetty " + lbl;
  if (!S.me) return;
  $("whoNm").textContent = S.me.n;
  $("whoAv").textContent = initials(S.me.n);
  const t = totals(), a = S.me.a, m = meterHTML(t, a);
  $("cartCt").textContent = t.units;
  $("meterFill").style.width = m.pct + "%";
  $("meter").classList.toggle("over", m.over);
  $("meter").setAttribute("aria-valuenow", Math.round(m.pct));
  $("nums").innerHTML = `<b>${money(t.value)}</b> of ${money(a)} retail` + (m.over
      ? `<span class="left over">${money(t.value-a)} over</span>`
      : `<span class="left">${money(a - t.value)} left</span>`)
    + (CONFIG.deadline ? `<span class="left">· Order by ${esc(CONFIG.deadline)}</span>` : "");
  const placed = store.get(K("placed"));
  $("placedBanner").hidden = !placed;
  if (placed) $("placedBanner").innerHTML = `<b>Order ${esc(placed.id)} placed</b> on ${new Date(placed.at).toLocaleDateString("en-US",{month:"short",day:"numeric"})} for ${money(placed.value)} retail. Need to change something? Email <span style="user-select:all">${esc(CONFIG.contact)}</span>, or build a new cart and place it as a revision.`;
}

/* ===== Catalog ===== */
function deptItems(){ return PRODUCTS.filter(p => p.dept === S.dept); }
function renderChips(){
  const subs = ["All", ...new Set(deptItems().map(p => p.sub))];
  $("chips").innerHTML = subs.length > 2 ? subs.map(s => `<button type="button" class="chip" data-s="${esc(s)}" aria-pressed="${s===S.sub}">${esc(s)}</button>`).join("") : "";
}
$("chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; S.sub=b.dataset.s; renderChips(); renderGrid(); });
$("dept").addEventListener("click", e => {
  const b=e.target.closest("button[data-d]"); if(!b) return;
  S.dept=b.dataset.d; S.sub="All";
  [...$("dept").children].forEach(x => x.setAttribute("aria-pressed", x===b));
  renderChips(); renderGrid();
});
$("q").addEventListener("input", e => { S.q = e.target.value.trim().toLowerCase(); renderGrid(); });

/* Photos: drop img/<STYLE>-1.jpg (main) and img/<STYLE>-2.jpg (hover) into the repo */
const imgPath = (s, n) => "img/" + encodeURIComponent(s) + "-" + n + ".jpg";
function photo(p){
  return `<div class="none"><b>${esc(p.d.split(" ")[0])}</b><small>Photo coming soon</small></div>
    <img class="a" src="${imgPath(p.s,1)}" alt="${esc(p.d)} in ${esc(p.c)}" loading="lazy" onload="this.parentNode.classList.add('hasA')" onerror="this.remove()">
    <img class="b" src="${imgPath(p.s,2)}" alt="" loading="lazy" onload="this.parentNode.classList.add('two')" onerror="this.remove()">`;
}
function cardFoot(p){
  let u=0; p.z.forEach(([,upc]) => u += S.cart[upc]||0);
  return u ? `<b>${u} in cart</b> · ${money(u*p.p)} retail` : "Enter a quantity under each size";
}
function renderGrid(){
  const nm = S.dept === "mens" ? "Mens" : "Accessories";
  $("h1").textContent = S.sub === "All" ? nm : S.sub;
  const items = deptItems().filter(p => (S.sub==="All" || p.sub===S.sub) &&
    (!S.q || (p.d+" "+p.c+" "+p.s+" "+p.sub).toLowerCase().includes(S.q)));
  $("countLbl").textContent = items.length + (items.length===1 ? " style" : " styles");
  $("grid").innerHTML = items.length ? items.map(p => {
    const has = p.z.some(([,u]) => S.cart[u]);
    return `<article class="card${has?" has":""}" data-s="${esc(p.s)}">
      <div class="ph">${photo(p)}${p.season!==CONFIG.season?`<span class="tag">${esc(p.season)}</span>`:""}</div>
      <div class="cb">
        <div class="ttl"><h3>${esc(p.d)}</h3><div class="price">${money(p.p)}<small>Retail</small></div></div>
        <div class="meta"><span>${esc(p.c)}</span><span class="code">${esc(p.s)}</span></div>
        <div class="sizes">${p.z.map(([size,upc]) => {
          const v = S.cart[upc]||"";
          return `<div class="sz"><label for="q${upc}">${esc(size)}</label><input id="q${upc}" data-u="${upc}" type="number" inputmode="numeric" min="0" max="99" step="1" value="${v}" class="${v?"on":""}" aria-label="${esc(p.d)} ${esc(p.c)} size ${esc(size)} quantity"></div>`;
        }).join("")}</div>
        <div class="cf">${cardFoot(p)}</div>
      </div></article>`;
  }).join("") : `<div class="empty">No styles match “${esc(S.q)}”.</div>`;
}
function setQty(upc, q){
  q = Math.max(0, Math.min(99, parseInt(q,10) || 0));
  if (q) S.cart[upc] = q; else delete S.cart[upc];
  store.set(K("cart"), S.cart);
  return q;
}
$("grid").addEventListener("input", e => {
  const inp = e.target.closest("input[data-u]"); if(!inp || !S.me) return;
  const q = setQty(inp.dataset.u, inp.value);
  inp.classList.toggle("on", !!q);
  const card = inp.closest(".card"), p = BY_UPC[inp.dataset.u].p;
  card.classList.toggle("has", p.z.some(([,u]) => S.cart[u]));
  card.querySelector(".cf").innerHTML = cardFoot(p);
  renderHeader();
});
$("grid").addEventListener("change", e => { const inp=e.target.closest("input[data-u]"); if(inp) inp.value = S.cart[inp.dataset.u] || ""; });
$("grid").addEventListener("click", e => { const ph=e.target.closest(".ph.two"); if(ph && matchMedia("(hover:none)").matches) ph.classList.toggle("flip"); });

let step = "cart";
function openCart(){ step = "cart"; $("drawer").hidden=false; $("scrim").hidden=false; renderCart(); }
function closeCart(){ $("drawer").hidden=true; $("scrim").hidden=true; renderGrid(); renderHeader(); }
$("cartBtn").addEventListener("click", () => S.me && openCart());
$("closeCart").addEventListener("click", closeCart);
$("scrim").addEventListener("click", closeCart);
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("drawer").hidden) closeCart(); });

function cartGroups(){
  const g = new Map();
  for (const [upc,q] of Object.entries(S.cart)) {
    const r = BY_UPC[upc]; if(!r||!q) continue;
    if(!g.has(r.p.s)) g.set(r.p.s, { p:r.p, lines:[] });
    g.get(r.p.s).lines.push({ size:r.size, upc, q });
  }
  const arr=[...g.values()];
  arr.forEach(x => x.lines.sort((a,b) => x.p.z.findIndex(z=>z[1]===a.upc) - x.p.z.findIndex(z=>z[1]===b.upc)));
  return arr.sort((a,b) => (a.p.dept>b.p.dept?-1:a.p.dept<b.p.dept?1:0) || a.p.so-b.p.so || a.p.d.localeCompare(b.p.d));
}
const SHIP_FIELDS = [
  ["name","Full name","name",true], ["line1","Street address","address-line1",true], ["line2","Apt, suite (optional)","address-line2",false],
  ["city","City","address-level2",true], ["state","State","address-level1",true], ["zip","ZIP","postal-code",true], ["phone","Phone (optional)","tel",false]
];
function shipText(){ const s=S.ship; return [s.name, s.line1, s.line2, [s.city, s.state].filter(Boolean).join(", ") + " " + (s.zip||""), s.phone].filter(x=>x&&x.trim()).join("\n"); }
function orderText(id){
  const t = totals(), a = S.me.a, rows = [];
  cartGroups().forEach(g => g.lines.forEach(l => rows.push(`${l.q} x ${g.p.s} ${l.size} | ${g.p.d} - ${g.p.c} | UPC ${l.upc}`)));
  return [ id ? `Order: ${id}` : null, `Ambassador: ${S.me.n}`, `Store: ${CONFIG.season} Ambassador Store`, `Units: ${t.units}`,
    `Retail total: ${money(t.value)} (allowance ${money(a)}${t.value>a?`, over by ${money(t.value-a)}`:""})`,
    S.notes ? `Notes: ${S.notes}` : null, ``, `Ship to:`, shipText(), ``, ...rows ].filter(x => x!==null).join("\n");
}
function newOrderId(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return "AMB-" + (S.me.id||"").slice(0,4).toUpperCase() + "-" + p(d.getMonth()+1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes());
}

function renderCart(){
  const groups = cartGroups(), t = totals(), a = S.me.a, m = meterHTML(t, a);
  const body=$("dBody"), foot=$("dFoot");
  if (step === "done") {
    const placed = store.get(K("placed"));
    $("dTitle").textContent = "Order placed";
    body.innerHTML = `<div class="review" style="padding-top:12px"><div class="okbox"><b>Thanks, ${esc(S.me.f || S.me.n)}!</b>
      Order <strong>${esc(placed.id)}</strong> is in. ${placed.units} units, ${money(placed.value)} retail.</div>
      <p class="hint">We'll review it and follow up by email if anything needs to change. Questions: <span style="user-select:all">${esc(CONFIG.contact)}</span></p></div>`;
    foot.innerHTML = `<button type="button" class="ghost" id="closeCart2">Done</button>`;
    return;
  }
  if (step === "fallback") {
    $("dTitle").textContent = "Email your order";
    body.innerHTML = `<div class="review" style="padding-top:12px">
      <p class="hint">Online ordering isn't switched on yet. Copy your order and email it to <strong style="user-select:all">${esc(CONFIG.contact)}</strong>.</p>
      <pre class="ordertext" id="otext">${esc(orderText(S.pendingId))}</pre></div>`;
    foot.innerHTML = `<button type="button" class="primary" id="copyOrder">Copy order</button><button type="button" class="ghost" id="toCheckout">Back</button>`;
    return;
  }
  if (step === "checkout") {
    $("dTitle").textContent = "Checkout";
    body.innerHTML = `<form class="review" id="shipForm" style="padding-top:12px" novalidate>
      <dl><dt>Name</dt><dd>${esc(S.me.n)}</dd><dt>Items</dt><dd>${t.units} units, ${groups.length} styles</dd>
      <dt>Retail value</dt><dd>${money(t.value)} of ${money(a)}</dd></dl>
      ${m.over?`<div class="note">This order is ${money(t.value-a)} over your allowance. You can still place it. We'll review it before it's approved.</div>`:""}
      <fieldset class="ship"><legend class="fl">Ship to</legend>
      ${SHIP_FIELDS.map(([k,l,ac,req]) => `<label class="f f-${k}"><span>${l}</span><input id="ship-${k}" name="${k}" autocomplete="shipping ${ac}" ${req?"required":""} value="${esc(S.ship[k]||"")}"${k==="state"?' maxlength="20"':""}${k==="zip"?' inputmode="numeric" maxlength="10"':""}${k==="phone"?' type="tel"':""}></label>`).join("")}
      </fieldset>
      <label class="fl" for="notes">Notes (optional)</label>
      <textarea id="notes" placeholder="Fit questions, delivery instructions…">${esc(S.notes||"")}</textarea>
      <div class="note" id="formErr" hidden></div>
    </form>`;
    foot.innerHTML = `<button type="button" class="primary" id="placeOrder">Place order</button><button type="button" class="ghost" id="backCart">Back to cart</button>`;
    return;
  }
  $("dTitle").textContent = "Your cart";
  if (!groups.length) {
    body.innerHTML = `<div class="dempty">Your cart is empty.<br>Type a quantity under any size to add it.</div>`;
    foot.innerHTML = `<button type="button" class="ghost" id="closeCart2">Keep shopping</button>`;
    return;
  }
  body.innerHTML = groups.map(g => {
    const u = g.lines.reduce((s,l)=>s+l.q,0);
    return `<div class="line"><div class="th"><img src="${imgPath(g.p.s,1)}" alt="" onerror="this.remove()"></div>
      <div><h4>${esc(g.p.d)}</h4><div class="sub">${esc(g.p.c)} · ${money(g.p.p)} each</div>
        <div class="qs">${g.lines.map(l=>`<span>${esc(l.size)} × ${l.q}</span>`).join("")}</div>
        <button type="button" class="link" data-rm="${esc(g.p.s)}">Remove</button></div>
      <div class="rt">${money(u*g.p.p)}<div class="sub">${u} ${u===1?"unit":"units"}</div></div></div>`;
  }).join("");
  foot.innerHTML = `<div class="tot"><span>${t.units} units · retail value</span><b>${money(t.value)}</b></div>
    <div class="meter${m.over?" over":""}"><i style="width:${m.pct}%"></i></div>
    <div class="tot" style="font-size:13px;color:var(--muted)"><span>Allowance ${money(a)}</span><span>${m.over?`<span style="color:var(--warn);font-weight:600">${money(t.value-a)} over</span>`:`${money(a-t.value)} left`}</span></div>
    ${m.over?`<div class="note">You're over your allowance. You can still place this order. We'll review it before it's approved.</div>`:""}
    <button type="button" class="primary" id="toCheckout">Checkout</button>`;
}
$("drawer").addEventListener("input", e => {
  if (e.target.id === "notes") S.notes = e.target.value;
  else if (e.target.id && e.target.id.startsWith("ship-")) S.ship[e.target.name] = e.target.value;
});
async function placeOrder(btn){
  const missing = SHIP_FIELDS.filter(([k,,,req]) => req && !(S.ship[k]||"").trim()).map(([,l]) => l.toLowerCase());
  const err = $("formErr");
  if (missing.length) { err.hidden=false; err.textContent = "Please add your " + missing.join(", ") + "."; return; }
  err.hidden = true;
  const t = totals(), id = newOrderId();
  S.pendingId = id;
  if (!CONFIG.orderEndpoint) { step = "fallback"; renderCart(); return; }
  const payload = {
    orderId: id, submittedAt: new Date().toISOString(), store: CONFIG.season + " Ambassador Store",
    ambassador: S.me.n, ambassadorId: S.me.id, email: S.me.e, allowance: S.me.a,
    retailTotal: Math.round(t.value*100)/100, units: t.units, overAllowance: t.value > S.me.a,
    revisionOf: (store.get(K("placed"))||{}).id || "", notes: S.notes || "",
    shipTo: { ...S.ship }, shipToText: shipText(),
    lines: cartGroups().flatMap(g => g.lines.map(l => ({ upc:l.upc, style:g.p.s, size:l.size, color:g.p.a, colorName:g.p.c, description:g.p.d, qty:l.q, retail:g.p.p }))),
    orderText: orderText(id)
  };
  btn.disabled = true; btn.textContent = "Placing order…";
  try {
    await fetch(CONFIG.orderEndpoint, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body: JSON.stringify(payload) });
    store.set(K("placed"), { id, at: payload.submittedAt, units: t.units, value: t.value });
    S.cart = {}; store.set(K("cart"), {}); S.notes = "";
    step = "done"; renderCart(); renderHeader();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Place order";
    err.hidden = false; err.textContent = "Your order didn't go through. Check your connection and try again. If it keeps failing, email " + CONFIG.contact + ".";
  }
}
$("drawer").addEventListener("click", e => {
  const id = e.target.id;
  if (e.target.dataset.rm) { const p = PRODUCTS.find(x=>x.s===e.target.dataset.rm); p.z.forEach(([,u])=>setQty(u,0)); renderCart(); renderHeader(); return; }
  if (id==="toCheckout"){ step="checkout"; renderCart(); }
  else if (id==="backCart"){ step="cart"; renderCart(); }
  else if (id==="closeCart2"){ closeCart(); }
  else if (id==="placeOrder"){ placeOrder(e.target); }
  else if (id==="copyOrder"){
    const txt = orderText(S.pendingId);
    const done = () => toast("Order copied. Paste it into an email to " + CONFIG.contact);
    const sel = () => { const r=document.createRange(); r.selectNodeContents($("otext")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Order selected. Copy it and email it to " + CONFIG.contact); };
    try { navigator.clipboard.writeText(txt).then(done, sel); } catch(err){ sel(); }
  }
});
let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 3600); }

/* ===== Boot ===== */
(async function boot(){
  renderHeader();
  S.me = await loadMe();
  if (!S.me) { $("whoNm").textContent = "—"; showGate(); return; }
  S.cart = store.get(K("cart")) || {};
  renderHeader(); renderChips(); renderGrid();
})();
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
